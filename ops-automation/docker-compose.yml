# Incident automation lab: Alertmanager -> n8n -> PostgreSQL incident store -> mock on-call notifier.
# Ports bind to 127.0.0.1 only. Secrets come from .env (`make env`), never from git.
name: opscircuit-incident-lab

# PostgreSQL 18: the incident upsert uses RETURNING old/new, and n8n 2.x supports 17 or newer.
x-postgres-image: &postgres-image postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
x-n8n-image: &n8n-image n8nio/n8n:2.43.7@sha256:3db21366be1d3c77c1708963129c051948573019659e8873e0294be035ffc1b2

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run make env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run make env}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_HIRING_BANNER_ENABLED: "false"
  N8N_PUBLIC_API_DISABLED: "true"
  N8N_COMMUNITY_PACKAGES_ENABLED: "false" # flagged by `n8n audit`; the lab uses built-in nodes only
  GENERIC_TIMEZONE: UTC
  TZ: UTC

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql # the 18+ images keep PGDATA in a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]

  # One-shot and idempotent: roles, databases, schema and the service catalog are applied on every start.
  db-setup:
    image: *postgres-image
    user: "70:70"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      INCIDENTS_DB_PASSWORD: ${INCIDENTS_DB_PASSWORD:?run make env}
    volumes:
      - ./db:/setup:ro
      - ./service-catalog/services.json:/catalog/services.json:ro
    entrypoint: ["sh", "/setup/setup.sh"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: imports credentials (built from .env inside the container) and the versioned workflows.
  n8n-import:
    image: *n8n-image
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      <<: *n8n-env
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?run make env}
      INCIDENTS_DB_PASSWORD: ${INCIDENTS_DB_PASSWORD}
    volumes:
      - ./n8n/import.sh:/import.sh:ro
      - ./workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    entrypoint: ["sh", "/import.sh"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  n8n:
    image: *n8n-image
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mock-notifier:
        condition: service_healthy
    environment:
      <<: *n8n-env
      N8N_SECURE_COOKIE: "false" # plain HTTP on localhost only
      N8N_LOG_FORMAT: json
      N8N_LOG_LEVEL: info
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN}
    # Alertmanager reads bearer tokens from a file, not from the environment.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        umask 077 && printf '%s' "$$ALERT_WEBHOOK_TOKEN" > /tmp/webhook-token &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: [/tmp, /alertmanager]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mock-notifier:
    image: node:26.12.1-alpine3.24@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
    user: node
    command: ["node", "/app/server.mjs"]
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - ./mock-notifier/server.mjs:/app/server.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  n8n_data:
