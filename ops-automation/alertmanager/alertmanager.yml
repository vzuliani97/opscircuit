# Alertmanager owns grouping, waiting and repeat intervals. n8n owns the incident record:
# deduplication by firing episode, enrichment, paging policy and failure handling.
route:
  receiver: n8n-incidents
  group_by: [alertname, namespace, service]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: n8n-incidents
    webhook_configs:
      - url: http://n8n:5678/webhook/alertmanager
        send_resolved: true
        max_alerts: 50
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/webhook-token
