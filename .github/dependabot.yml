version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /ops-automation
    schedule:
      interval: weekly
    ignore:
      # Majors (n8n, PostgreSQL, Node.js) are planned migrations re-verified with `make test`, not drive-by PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
