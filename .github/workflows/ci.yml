name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo unless they declare more.
permissions:
  contents: read

jobs:
  manifests:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate every rendered manifest against the Kubernetes schema
        run: make validate

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh ops-automation/scripts/*.sh ops-automation/db/*.sh ops-automation/n8n/*.sh

  incident-lab:
    name: n8n incident lab (integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose, workflow and fixture JSON
        run: make validate
      - name: Start the lab (waits for health checks, bounded)
        run: make up
      - name: Integration tests
        run: make test
      - name: n8n security audit (report only; findings reviewed in docs)
        run: make audit
      - name: Container logs on failure
        if: failure()
        run: make logs
      - name: Tear down
        if: always()
        run: make clean

  security:
    name: Security (secrets, dependencies, IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Scan git history for secrets (Gitleaks)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Scan Terraform and Kubernetes manifests (Checkov)
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/gitops > rendered/paypoint.yaml
          kubectl kustomize observability > rendered/observability.yaml
          docker run --rm -v "$PWD":/src bridgecrew/checkov:3.4.0 --config-file /src/.checkov.yaml
