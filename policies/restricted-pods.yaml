# Container-level checks of the Kubernetes "restricted" Pod Security Standard, plus a read-only
# root filesystem. Pod Security Admission already enforces "baseline" on the namespace; this policy
# enforces the stricter profile, and the Kyverno CLI runs the same checks on the manifests in CI.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restricted-pods
spec:
  validationActions: [Deny]
  # Also check Deployments and StatefulSets, so a bad manifest fails at apply time instead of
  # leaving a controller that can never create its pods.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [paypoint, monitoring]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: podNonRoot
      expression: object.spec.?securityContext.?runAsNonRoot.orValue(false)
    - name: podSeccomp
      expression: object.spec.?securityContext.?seccompProfile.?type.orValue('')
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(variables.podNonRoot) == true)
      message: Containers must run as non-root (runAsNonRoot on the pod or on the container).
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: Containers must set allowPrivilegeEscalation to false.
    - expression: >-
        variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      message: Containers must drop all Linux capabilities.
    - expression: >-
        variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue(variables.podSeccomp) in ['RuntimeDefault', 'Localhost'])
      message: Containers must use the RuntimeDefault seccomp profile (on the pod or on the container).
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: Containers must mount their root filesystem read-only; write to an emptyDir or a volume instead.
